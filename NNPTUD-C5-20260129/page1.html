<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="main.js"></script>
</head>

<body>
    <div class="container my-4">
        <div class="d-flex gap-2 mb-3">
            <input id="search-input" class="form-control" placeholder="Tìm theo tên..." />
            <div class="btn-group" role="group">
                <button id="sort-name" class="btn btn-outline-primary">Tên ↑</button>
                <button id="sort-views" class="btn btn-outline-primary">Giá ↑</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Giá</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
    <style>
        .deleted {
            text-decoration: line-through;
            color: #6c757d;
        }
        .comments-row td {
            background: #f8f9fa;
            padding: 0.5rem 1.25rem;
        }
    </style>

    <div class="container mb-4">
        <h5>Thêm / Sửa bài</h5>
        <form id="post-form" class="row g-2 align-items-end" onsubmit="event.preventDefault(); savePost();">
            <input type="hidden" id="post-id" />
            <div class="col-auto">
                <label class="form-label">Tên</label>
                <input id="post-title" class="form-control" required />
            </div>
            <div class="col-auto">
                <label class="form-label">Giá</label>
                <input id="post-views" class="form-control" type="number" required />
            </div>
            <div class="col-auto">
                <button class="btn btn-success">Lưu</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Hủy</button>
            </div>
        </form>
    </div>
</body>

</html>
